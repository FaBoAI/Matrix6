<text x="252.4800000000001" y="137.5" font-size="21">U1</text>
<rect x="311.9000000000001" y="960.5499999999998" width="125.16" height="102.89999999999999" fill="none" stroke="#647488" stroke-width="2" stroke-dasharray="7 5"/>
<text x="315.9000000000001" y="985.5499999999998" font-size="21">J1 USB-C</text>
<text x="201.5600000000001" y="413.19999999999993" font-size="20">R3/R4</text>
<text x="455.98000000000013" y="909.5" font-size="20">R11 0R</text>
<text x="90" y="1115" font-size="23">D+ red / D− blue; all USB copper on L1.</text>
<text x="90" y="1150" font-size="23">Board: 40.64 × 61.00; 4 corners R2</text>
<text x="90" y="1185" font-size="23">KiCad coordinates: X=97.46..138.10</text>
<text x="90" y="1220" font-size="22">Y=100..161 (downward). Gerber Y is negative.</text>
<text x="750" y="170" font-size="34">TWO-LAYER PROTOTYPE / USB</text>
<text x="750" y="211" font-size="27">No controlled-impedance service assumed.</text>
<text x="750" y="252" font-size="26">Nominal uniform cross-section: about 90 ohm.</text>
<text x="750" y="293" font-size="24">Target 90 ohm ±10%; prototype testing required.</text>
<text x="750" y="334" font-size="26">F.Cu width 0.380 / edge gap 0.180</text>
<text x="750" y="375" font-size="26">Front coplanar GND clearance: 0.200</text>
<text x="750" y="416" font-size="24">Preserve coplanar ground bands and stitches.</text>
<text x="750" y="457" font-size="24">Rear GND is a pour with signal crossings.</text>
<text x="750" y="498" font-size="26">FR4 1.6 mm nominal; 1 oz outer copper.</text>
<text x="750" y="539" font-size="24">CAD core 1.530; copper 0.035 each side.</text>
<text x="750" y="580" font-size="24">CAD dielectric Er=4.5 is a modelling assumption.</text>
<text x="750" y="621" font-size="24">Uniform straight section: PCB Y=128.5..141.5.</text>
<text x="750" y="662" font-size="24">Pads, bends and length match are transitions.</text>
<text x="750" y="703" font-size="24">Do not substitute a four-layer impedance stack.</text>
<text x="750" y="744" font-size="24">Submit CAM geometry changes for review.</text>
<text x="750" y="785" font-size="20"></text>
<text x="750" y="826" font-size="34">LAYER ORDER / DRILL</text>
<text x="750" y="867" font-size="23">L1: Matrix6-F_Cu.gtl / L2: Matrix6-B_Cu.gbl</text>
<text x="750" y="908" font-size="24">Exactly TWO copper files. No inner copper.</text>
<text x="750" y="949" font-size="24">Min. finished drill 0.300; normal via pad 0.600.</text>
<text x="750" y="990" font-size="24">U1 pad 41: 12 thermal holes 0.300 / pad 0.800.</text>
<text x="750" y="1031" font-size="24">Thermal annulus 0.250; preserve array positions.</text>
<text x="750" y="1072" font-size="24">Epoxy-fill and copper-cap thermal/in-pad vias.</text>
<text x="750" y="1113" font-size="24">U1 thermal PTH pads are NOT component leads.</text>
<text x="750" y="1154" font-size="24">Keep connector holes, USB slots and NPTH OPEN.</text>
<text x="750" y="1195" font-size="24">Drill counts/sizes: review/drill-report.txt.</text>
<text x="750" y="1236" font-size="24">Preserve supplied soldermask openings.</text>
<text x="60" y="1330" font-size="25">USB connector body: no L1 tracks, vias or copper fill under x113.31..122.25 / y154.325..161.675.</text>
<text x="60" y="1370" font-size="23">Keep pads, RF antenna keepout and front coplanar GND. This sheet is fabrication guidance, not a Gerber layer.</text>
