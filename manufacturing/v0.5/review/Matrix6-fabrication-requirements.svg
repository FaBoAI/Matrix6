<text x="315.9000000000001" y="985.5499999999998" font-size="21">J1 USB-C</text>
<text x="201.5600000000001" y="413.19999999999993" font-size="20">R3/R4</text>
<text x="455.98000000000013" y="909.5" font-size="20">R11 0R</text>
<text x="90" y="1115" font-size="23">D+ red / D− blue; all USB copper on L1.</text>
<text x="90" y="1150" font-size="23">Board: 40.64 × 61.00</text>
<text x="90" y="1185" font-size="23">KiCad coordinates: X=97.46..138.10</text>
<text x="90" y="1220" font-size="22">Y=100..161 (downward). Gerber Y is negative.</text>
<text x="750" y="170" font-size="34">CONTROLLED IMPEDANCE</text>
<text x="750" y="211" font-size="29">Target: differential 90 ohm ±10%</text>
<text x="750" y="252" font-size="26">Signal: L1 / F.Cu, USB_P and USB_N</text>
<text x="750" y="293" font-size="26">Reference: L2 / In1.Cu, continuous GND</text>
<text x="750" y="334" font-size="26">Uniform width: 0.280  |  edge gap: 0.200</text>
<text x="750" y="375" font-size="26">L1 coplanar GND clearance: 0.500</text>
<text x="750" y="416" font-size="26">Stackup: JLC04161H-7628, nominal 1.6 mm</text>
<text x="750" y="457" font-size="24">L1/L4 copper: 0.035; L2/L3 copper: 0.0152</text>
<text x="750" y="498" font-size="24">L1-L2 / L3-L4 dielectric: 0.2104 (7628)</text>
<text x="750" y="539" font-size="24">L2-L3 dielectric core: 1.065</text>
<text x="750" y="580" font-size="24">Main controlled section: KiCad Y=122..145.85.</text>
<text x="750" y="621" font-size="24">0.200-wide pad escapes are local transitions.</text>
<text x="750" y="662" font-size="24">CAM must review width/gap for the actual material.</text>
<text x="750" y="703" font-size="24">Provide impedance calculation, coupon and report.</text>
<text x="750" y="744" font-size="24">Submit CAM geometry changes for customer review.</text>
<text x="750" y="785" font-size="20"></text>
<text x="750" y="826" font-size="34">LAYER ORDER / DRILL</text>
<text x="750" y="867" font-size="23">L1: Matrix6-F_Cu.gtl  /  L2: Matrix6-In1_Cu.g1</text>
<text x="750" y="908" font-size="23">L3: Matrix6-In2_Cu.g2 /  L4: Matrix6-B_Cu.gbl</text>
<text x="750" y="949" font-size="24">PTH: 12 × 0.200 thermal holes in U1 pad 41;</text>
<text x="750" y="990" font-size="24">130 × 0.300 vias; 40 × 1.000 connector holes;</text>
<text x="750" y="1031" font-size="24">4 plated USB slots (0.600 tool diameter).</text>
<text x="750" y="1072" font-size="24">NPTH: 2 × 0.650 USB positioning holes.</text>
<text x="750" y="1113" font-size="24">Epoxy-fill and copper-cap U1 thermal holes.</text>
<text x="750" y="1154" font-size="24">These are thermal vias, NOT component lead holes.</text>
<text x="750" y="1195" font-size="24">Keep connector holes, USB slots and NPTH OPEN.</text>
<text x="750" y="1236" font-size="24">Preserve soldermask openings as supplied.</text>
<text x="60" y="1330" font-size="25">USB connector body: no L1 tracks, vias or copper fill under x113.31..122.25 / y154.325..161.675.</text>
<text x="60" y="1370" font-size="23">Keep the supplied pads, board edge, RF antenna area and continuous L2 ground. This sheet is fabrication guidance, not a Gerber layer.</text>
