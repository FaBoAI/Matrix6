<text x="625" y="150" font-size="17">15.8 mm wide × 22.5 mm deep</text>
<text x="625" y="182" font-size="17">Opening faces the antenna edge.</text>
<text x="625" y="214" font-size="17">No rear component courtyard overlaps.</text>
<text x="625" y="246" font-size="17">A rear placement keepout protects the path.</text>
